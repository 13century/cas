<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>13 FORTUNE – Премиум Казино</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0808;
            color: #eeddcc;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at top, #1f130b 0%, #0a0808 70%);
        }

        /* главный контейнер */
        .app {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 1px solid rgba(218, 165, 32, 0.25);
            margin-bottom: 24px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2rem;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.3);
            letter-spacing: 2px;
        }
        .logo small {
            font-size: 0.7rem;
            -webkit-text-fill-color: #b8963a;
            background: none;
            display: block;
            text-align: right;
            letter-spacing: 4px;
            margin-top: -6px;
        }

        .balance-box {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(218, 165, 32, 0.3);
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(4px);
        }
        .balance-box span {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #b8963a;
            letter-spacing: 1px;
        }
        .balance-box .amount {
            font-weight: 700;
            font-size: 1.3rem;
            color: #f5d742;
            min-width: 80px;
            text-align: right;
        }

        /* навигация */
        .nav {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .nav button {
            flex: 1;
            min-width: 100px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(218, 165, 32, 0.2);
            border-radius: 40px;
            padding: 12px 10px;
            color: #ccbdaa;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(2px);
            letter-spacing: 0.5px;
        }
        .nav button.active {
            background: rgba(218, 165, 32, 0.15);
            border-color: #d4a024;
            color: #f5d742;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.1);
        }
        .nav button i {
            margin-right: 8px;
        }

        /* игровые экраны */
        .game-screen {
            display: none;
            animation: fade 0.4s ease;
        }
        .game-screen.active {
            display: block;
        }
        @keyframes fade {
            0% { opacity: 0.3; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* карточки игр на главной */
        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .game-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(218, 165, 32, 0.15);
            border-radius: 24px;
            padding: 30px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        .game-card:hover {
            transform: translateY(-6px);
            border-color: #d4a024;
            background: rgba(218, 165, 32, 0.05);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        .game-card i {
            font-size: 3.2rem;
            color: #f5d742;
            margin-bottom: 12px;
            display: block;
        }
        .game-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #eeddcc;
        }
        .game-card p {
            font-size: 0.85rem;
            color: #b8963a;
            margin-top: 6px;
        }

        /* СЛОТЫ */
        .slot-machine {
            background: rgba(20,15,12,0.8);
            border-radius: 40px;
            padding: 30px 20px;
            border: 1px solid rgba(218, 165, 32, 0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
        }

        .reels {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 30px;
        }
        .reel {
            width: 90px;
            height: 120px;
            background: #1f1a16;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            border: 2px solid #2f251e;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
        }
        .reel .symbol {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 3.2rem;
            line-height: 1;
            text-shadow: 0 0 20px rgba(218, 165, 32, 0.2);
        }
        .reel.spinning .symbol {
            animation: spinReel 0.8s ease-out;
        }
        @keyframes spinReel {
            0% { transform: translateY(-120px); opacity: 0.2; }
            30% { transform: translateY(20px); }
            60% { transform: translateY(-10px); }
            100% { transform: translateY(0); opacity: 1; }
        }

        .slot-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
        }
        .bet-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 6px 16px 6px 20px;
            border-radius: 40px;
            border: 1px solid rgba(218, 165, 32, 0.15);
        }
        .bet-area label {
            font-size: 0.8rem;
            color: #b8963a;
        }
        .bet-area input {
            width: 80px;
            background: transparent;
            border: none;
            color: #f5d742;
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }
        .bet-area input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .bet-area button {
            background: none;
            border: none;
            color: #b8963a;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.2s;
        }
        .bet-area button:hover { color: #f5d742; }

        .spin-btn {
            background: linear-gradient(135deg, #d4a024, #b8860b);
            border: none;
            border-radius: 60px;
            padding: 14px 40px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #0a0808;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(218, 165, 32, 0.3);
            transition: 0.2s;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .spin-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 40px rgba(218, 165, 32, 0.5);
        }
        .spin-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .slot-result {
            margin-top: 18px;
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            min-height: 3rem;
            color: #f5d742;
            text-shadow: 0 0 30px rgba(218,165,32,0.2);
        }

        /* РУЛЕТКА */
        .roulette-wrapper {
            background: rgba(20,15,12,0.8);
            border-radius: 40px;
            padding: 30px 20px;
            border: 1px solid rgba(218, 165, 32, 0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
        }

        .roulette-wheel {
            display: flex;
            justify-content: center;
            margin: 10px 0 20px;
        }
        .wheel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                #1a472a 0deg 10deg, #8b0000 10deg 20deg, #1a472a 20deg 30deg, #8b0000 30deg 40deg,
                #1a472a 40deg 50deg, #8b0000 50deg 60deg, #1a472a 60deg 70deg, #8b0000 70deg 80deg,
                #1a472a 80deg 90deg, #8b0000 90deg 100deg, #1a472a 100deg 110deg, #8b0000 110deg 120deg,
                #1a472a 120deg 130deg, #8b0000 130deg 140deg, #1a472a 140deg 150deg, #8b0000 150deg 160deg,
                #1a472a 160deg 170deg, #8b0000 170deg 180deg, #1a472a 180deg 190deg, #8b0000 190deg 200deg,
                #1a472a 200deg 210deg, #8b0000 210deg 220deg, #1a472a 220deg 230deg, #8b0000 230deg 240deg,
                #1a472a 240deg 250deg, #8b0000 250deg 260deg, #1a472a 260deg 270deg, #8b0000 270deg 280deg,
                #1a472a 280deg 290deg, #8b0000 290deg 300deg, #1a472a 300deg 310deg, #8b0000 310deg 320deg,
                #1a472a 320deg 330deg, #8b0000 330deg 340deg, #1a472a 340deg 350deg, #8b0000 350deg 360deg
            );
            border: 6px solid #d4a024;
            box-shadow: 0 0 40px rgba(218,165,32,0.3), inset 0 0 30px rgba(0,0,0,0.5);
            position: relative;
            transition: transform 2s cubic-bezier(0.21, 0.8, 0.35, 1);
        }
        .wheel .pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.4rem;
            color: #f5d742;
            filter: drop-shadow(0 0 10px gold);
        }
        .wheel-number {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 4px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.4rem;
            border: 1px solid #d4a024;
            color: #f5d742;
        }

        .roulette-bets {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .bet-chip {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(218, 165, 32, 0.2);
            border-radius: 40px;
            padding: 8px 20px;
            color: #eeddcc;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .bet-chip.active {
            background: rgba(218, 165, 32, 0.15);
            border-color: #d4a024;
            color: #f5d742;
        }
        .bet-chip:hover {
            background: rgba(218, 165, 32, 0.08);
        }

        .roulette-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .roulette-result {
            margin-top: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            color: #f5d742;
            min-height: 2.6rem;
        }

        /* общее */
        .text-gold {
            color: #d4a024;
        }
        .text-green {
            color: #2ecc71;
        }
        .text-red {
            color: #e74c3c;
        }
        .mt-2 { margin-top: 12px; }
        .mb-2 { margin-bottom: 12px; }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.75rem;
            color: #5a4a3a;
            border-top: 1px solid rgba(218,165,32,0.08);
            padding-top: 20px;
        }
        .footer i {
            color: #b8963a;
        }

        /* мобильные */
        @media (max-width: 600px) {
            .logo { font-size: 1.6rem; }
            .balance-box .amount { font-size: 1rem; min-width: 60px; }
            .reel { width: 70px; height: 100px; font-size: 2.2rem; }
            .reel .symbol { font-size: 2.6rem; }
            .games-grid { grid-template-columns: 1fr; }
            .wheel { width: 160px; height: 160px; }
            .slot-machine, .roulette-wrapper { padding: 20px 12px; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- ШАПКА -->
    <header class="header">
        <div class="logo">
            13 FORTUNE
            <small>✦ CASINO ✦</small>
        </div>
        <div class="balance-box">
            <span>Баланс</span>
            <span class="amount" id="balanceDisplay">10 000</span>
        </div>
    </header>

    <!-- НАВИГАЦИЯ -->
    <nav class="nav" id="mainNav">
        <button class="active" data-screen="home"><i class="fas fa-home"></i> Главная</button>
        <button data-screen="slots"><i class="fas fa-dice"></i> Слоты</button>
        <button data-screen="roulette"><i class="fas fa-circle"></i> Рулетка</button>
    </nav>

    <!-- ГЛАВНАЯ -->
    <div id="screen-home" class="game-screen active">
        <h2 style="font-family:'Playfair Display',serif; font-size:1.8rem; text-align:center; color:#d4a024;">Добро пожаловать в 13 FORTUNE</h2>
        <p style="text-align:center; color:#b8963a; margin-bottom:12px;">Испытай свою удачу в лучших играх</p>
        <div class="games-grid">
            <div class="game-card" data-screen="slots">
                <i class="fas fa-dice"></i>
                <h3>Слоты</h3>
                <p>Крути барабаны и выигрывай</p>
            </div>
            <div class="game-card" data-screen="roulette">
                <i class="fas fa-circle"></i>
                <h3>Рулетка</h3>
                <p>Ставь на цвет или число</p>
            </div>
        </div>
    </div>

    <!-- СЛОТЫ -->
    <div id="screen-slots" class="game-screen">
        <div class="slot-machine">
            <h3 style="text-align:center; font-family:'Playfair Display',serif; color:#d4a024; font-size:1.6rem;">✨ БАРАБАНЫ ✨</h3>
            <div class="reels" id="reelsContainer">
                <div class="reel" id="reel0"><span class="symbol">🍒</span></div>
                <div class="reel" id="reel1"><span class="symbol">🍒</span></div>
                <div class="reel" id="reel2"><span class="symbol">🍒</span></div>
            </div>
            <div class="slot-controls">
                <div class="bet-area">
                    <label>Ставка</label>
                    <button id="betDec">−</button>
                    <input type="number" id="betAmount" value="100" min="10" step="10">
                    <button id="betInc">+</button>
                </div>
                <button class="spin-btn" id="spinBtn"><i class="fas fa-arrows-rotate"></i> SPIN</button>
            </div>
            <div class="slot-result" id="slotResult">Нажмите SPIN</div>
        </div>
    </div>

    <!-- РУЛЕТКА -->
    <div id="screen-roulette" class="game-screen">
        <div class="roulette-wrapper">
            <h3 style="text-align:center; font-family:'Playfair Display',serif; color:#d4a024; font-size:1.6rem;">🎡 РУЛЕТКА 🎡</h3>
            <div class="roulette-wheel">
                <div class="wheel" id="rouletteWheel">
                    <div class="pointer">▼</div>
                    <div class="wheel-number" id="wheelNumber">0</div>
                </div>
            </div>

            <div class="roulette-bets" id="betTypeContainer">
                <button class="bet-chip active" data-bet="red">🔴 Красное</button>
                <button class="bet-chip" data-bet="black">⚫ Чёрное</button>
                <button class="bet-chip" data-bet="even">Чёт</button>
                <button class="bet-chip" data-bet="odd">Нечет</button>
                <button class="bet-chip" data-bet="number">Число</button>
            </div>
            <div id="numberPicker" style="display:none; text-align:center; margin:12px 0;">
                <input type="number" id="rouletteNumber" min="0" max="36" value="7" style="width:80px; background:#1f1a16; border:1px solid #d4a024; border-radius:30px; padding:8px; color:#f5d742; text-align:center; font-weight:700;">
                <label style="color:#b8963a; margin-left:8px;">Выберите число (0-36)</label>
            </div>

            <div class="roulette-controls">
                <div class="bet-area">
                    <label>Ставка</label>
                    <button id="rouletteBetDec">−</button>
                    <input type="number" id="rouletteBetAmount" value="100" min="10" step="10">
                    <button id="rouletteBetInc">+</button>
                </div>
                <button class="spin-btn" id="rouletteSpinBtn"><i class="fas fa-rotate"></i> Вращать</button>
            </div>
            <div class="roulette-result" id="rouletteResult">Сделайте ставку</div>
        </div>
    </div>

    <footer class="footer">
        <i class="fas fa-gem"></i> 13 FORTUNE – только для взрослых. Играйте ответственно.
    </footer>
</div>

<!-- FontAwesome (иконки) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script>
    // ====== ГЛОБАЛЬНОЕ СОСТОЯНИЕ ======
    let balance = 10000;
    const balanceEl = document.getElementById('balanceDisplay');

    function updateBalance() {
        balanceEl.textContent = balance.toLocaleString();
    }

    // ====== НАВИГАЦИЯ ======
    const navButtons = document.querySelectorAll('#mainNav button');
    const screens = {
        home: document.getElementById('screen-home'),
        slots: document.getElementById('screen-slots'),
        roulette: document.getElementById('screen-roulette')
    };

    // переход по клику на кнопки навигации
    navButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const screen = this.dataset.screen;
            showScreen(screen);
        });
    });

    // также клик по карточкам игр
    document.querySelectorAll('.game-card').forEach(card => {
        card.addEventListener('click', function() {
            const screen = this.dataset.screen;
            showScreen(screen);
        });
    });

    function showScreen(screenId) {
        // обновить активную кнопку
        navButtons.forEach(b => b.classList.remove('active'));
        const activeBtn = document.querySelector(`#mainNav button[data-screen="${screenId}"]`);
        if (activeBtn) activeBtn.classList.add('active');

        // скрыть все экраны
        Object.values(screens).forEach(el => el.classList.remove('active'));
        // показать нужный
        if (screens[screenId]) screens[screenId].classList.add('active');
    }

    // ====== СЛОТЫ ======
    const symbols = ['🍒', '🍋', '🍊', '💎', '7️⃣', '🔔', '⭐'];
    // выигрышные комбинации (множители)
    const payouts = {
        '7️⃣7️⃣7️⃣': 50,
        '💎💎💎': 30,
        '⭐⭐⭐': 20,
        '🔔🔔🔔': 15,
        '🍒🍒🍒': 10,
        '🍋🍋🍋': 8,
        '🍊🍊🍊': 8,
    };
    // также две одинаковые подряд (первые два или последние два) – дают x2
    const twoOfAKind = 2;

    const reelElements = [
        document.getElementById('reel0'),
        document.getElementById('reel1'),
        document.getElementById('reel2')
    ];
    const betInput = document.getElementById('betAmount');
    const spinBtn = document.getElementById('spinBtn');
    const slotResult = document.getElementById('slotResult');

    // изменение ставки
    document.getElementById('betDec').addEventListener('click', () => changeBet(-10));
    document.getElementById('betInc').addEventListener('click', () => changeBet(10));

    function changeBet(delta) {
        let val = parseInt(betInput.value) || 10;
        val = Math.max(10, Math.min(1000, val + delta));
        betInput.value = val;
    }

    // SPIN
    spinBtn.addEventListener('click', spinSlots);

    function spinSlots() {
        const bet = parseInt(betInput.value) || 10;
        if (bet > balance) {
            slotResult.textContent = '❌ Недостаточно средств!';
            slotResult.style.color = '#e74c3c';
            return;
        }

        // списываем ставку
        balance -= bet;
        updateBalance();
        spinBtn.disabled = true;
        slotResult.textContent = '🌀 Крутим...';
        slotResult.style.color = '#f5d742';

        // генерируем результаты
        const results = [];
        for (let i = 0; i < 3; i++) {
            const idx = Math.floor(Math.random() * symbols.length);
            results.push(symbols[idx]);
        }

        // анимация прокрутки
        reelElements.forEach((reel, i) => {
            const symbolSpan = reel.querySelector('.symbol');
            symbolSpan.textContent = results[i];
            // перезапуск анимации
            reel.classList.remove('spinning');
            void reel.offsetWidth; // триггер reflow
            reel.classList.add('spinning');
        });

        // проверка выигрыша после анимации (через 0.9s)
        setTimeout(() => {
            const combo = results.join('');
            let win = 0;
            let winMessage = '';

            // проверяем три одинаковых
            if (payouts[combo]) {
                win = bet * payouts[combo];
                winMessage = `🎉 Джекпот! x${payouts[combo]} = ${win}`;
            } else {
                // проверяем две одинаковых (первые два или последние два)
                if (results[0] === results[1]) {
                    win = bet * twoOfAKind;
                    winMessage = `Пара! x2 = ${win}`;
                } else if (results[1] === results[2]) {
                    win = bet * twoOfAKind;
                    winMessage = `Пара! x2 = ${win}`;
                } else {
                    winMessage = '😔 Попробуйте ещё';
                }
            }

            if (win > 0) {
                balance += win;
                updateBalance();
                slotResult.innerHTML = `💰 Выигрыш: ${win} $`;
                slotResult.style.color = '#2ecc71';
            } else {
                slotResult.textContent = '❌ Проигрыш';
                slotResult.style.color = '#e74c3c';
            }
            spinBtn.disabled = false;

        }, 900);
    }

    // ====== РУЛЕТКА ======
    const rouletteWheel = document.getElementById('rouletteWheel');
    const wheelNumber = document.getElementById('wheelNumber');
    const rouletteBetInput = document.getElementById('rouletteBetAmount');
    const rouletteResult = document.getElementById('rouletteResult');

    const betTypeBtns = document.querySelectorAll('#betTypeContainer .bet-chip');
    let selectedBetType = 'red';
    let selectedNumber = 7;

    betTypeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            betTypeBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            selectedBetType = this.dataset.bet;
            // показать/скрыть выбор числа
            document.getElementById('numberPicker').style.display = (selectedBetType === 'number') ? 'block' : 'none';
        });
    });

    document.getElementById('rouletteNumber').addEventListener('input', function() {
        let val = parseInt(this.value) || 0;
        if (val < 0) val = 0;
        if (val > 36) val = 36;
        selectedNumber = val;
    });

    document.getElementById('rouletteBetDec').addEventListener('click', () => changeRouletteBet(-10));
    document.getElementById('rouletteBetInc').addEventListener('click', () => changeRouletteBet(10));

    function changeRouletteBet(delta) {
        let val = parseInt(rouletteBetInput.value) || 10;
        val = Math.max(10, Math.min(1000, val + delta));
        rouletteBetInput.value = val;
    }

    document.getElementById('rouletteSpinBtn').addEventListener('click', spinRoulette);

    function spinRoulette() {
        const bet = parseInt(rouletteBetInput.value) || 10;
        if (bet > balance) {
            rouletteResult.textContent = '❌ Недостаточно средств!';
            rouletteResult.style.color = '#e74c3c';
            return;
        }

        // списываем
        balance -= bet;
        updateBalance();

        // вращаем колесо
        const resultNum = Math.floor(Math.random() * 37); // 0-36
        // цвет: 0 зеленый, красные 1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36
        const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        const isRed = reds.includes(resultNum);
        const isBlack = resultNum !== 0 && !isRed;

        // анимация вращения (просто поворот)
        const deg = 360 * 5 + Math.random() * 360; // минимум 5 оборотов
        rouletteWheel.style.transform = `rotate(${deg}deg)`;
        // обновим номер после вращения
        setTimeout(() => {
            wheelNumber.textContent = resultNum;
        }, 200);

        // проверим выигрыш через 2.5 сек
        rouletteResult.textContent = '🌀 Вращается...';
        rouletteResult.style.color = '#f5d742';
        rouletteSpinBtn.disabled = true;

        setTimeout(() => {
            let win = 0;
            let winMsg = '';
            let winColor = '#e74c3c';

            // определение выигрыша по типу ставки
            if (selectedBetType === 'red') {
                if (isRed) { win = bet * 2; winMsg = `🔴 Красное! Выигрыш ${win}`; winColor = '#2ecc71'; }
                else { winMsg = `Не красное (${resultNum})`; }
            } else if (selectedBetType === 'black') {
                if (isBlack) { win = bet * 2; winMsg = `⚫ Чёрное! Выигрыш ${win}`; winColor = '#2ecc71'; }
                else { winMsg = `Не чёрное (${resultNum})`; }
            } else if (selectedBetType === 'even') {
                if (resultNum !== 0 && resultNum % 2 === 0) { win = bet * 2; winMsg = `Чёт! Выигрыш ${win}`; winColor = '#2ecc71'; }
                else { winMsg = `Не чёт (${resultNum})`; }
            } else if (selectedBetType === 'odd') {
                if (resultNum !== 0 && resultNum % 2 !== 0) { win = bet * 2; winMsg = `Нечет! Выигрыш ${win}`; winColor = '#2ecc71'; }
                else { winMsg = `Не нечет (${resultNum})`; }
            } else if (selectedBetType === 'number') {
                if (resultNum === selectedNumber) { win = bet * 35; winMsg = `🎯 Число ${selectedNumber}! Выигрыш ${win}`; winColor = '#2ecc71'; }
                else { winMsg = `Выпало ${resultNum}, не ${selectedNumber}`; }
            }

            if (win > 0) {
                balance += win;
                updateBalance();
                rouletteResult.innerHTML = `💰 ${winMsg}`;
                rouletteResult.style.color = '#2ecc71';
            } else {
                rouletteResult.textContent = `❌ Проигрыш. ${winMsg}`;
                rouletteResult.style.color = '#e74c3c';
            }
            rouletteSpinBtn.disabled = false;
        }, 2500);
    }

    // начальная синхронизация баланса
    updateBalance();

    // если нажать на число в рулетке — показать picker
    document.querySelector('#betTypeContainer .bet-chip[data-bet="number"]').click();

    console.log('🎰 13 FORTUNE готово! Баланс: ' + balance);
</script>

</body>
</html>
